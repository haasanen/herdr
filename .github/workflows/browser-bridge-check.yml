name: Browser bridge compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/browser.rs'
      - 'src/cli/browser.rs'
      - 'src/integration/env.rs'
      - 'tests/fixtures/browser-launcher/**'
      - '.github/workflows/browser-bridge-check.yml'

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
      - name: Verify the real Linux browser launcher calls Herdr
        run: cargo test --manifest-path tests/fixtures/browser-launcher/Cargo.toml --locked
